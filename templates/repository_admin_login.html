<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulation Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main style="max-width:520px;margin:50px auto;padding:24px"><h1>Simulation Administrator Login</h1><p>Administrator authentication is required for protected actions such as reopening a closed training stream or deleting a repository report.</p>{% if error %}<div style="padding:12px;border:1px solid #b00020;margin:12px 0">{{ error }}</div>{% endif %}<form method="post"><label>Username</label><input name="username" autocomplete="username" required style="width:100%;padding:12px;margin:6px 0 14px"><label>Password</label><input name="password" type="password" autocomplete="current-password" required style="width:100%;padding:12px;margin:6px 0 18px"><button class="repo-btn" type="submit">Admin Login</button> <a class="repo-btn" href="{{ next_url or '/report-repository' }}">Cancel</a></form></main></body></html>
